<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PlayLedger | Pembayaran</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body data-page="payments"><div class="app-shell"><main class="main-panel"><header class="topbar"><div><p class="eyebrow">PlayLedger / Akuntansi</p><h1>Pembayaran</h1><small class="muted">Catat pembayaran dan pantau piutang per transaksi</small></div><button class="secondary-btn" id="refresh-page">Refresh</button></header><section class="card"><div class="card-head"><div><p class="eyebrow">Buku pembayaran</p><h3>Tagihan penyewaan</h3></div></div><input id="payment-search" class="search-input" type="search" placeholder="Cari ID, pelanggan, atau unit..."><div class="table-wrap"><table><thead><tr><th>ID sewa</th><th>Pelanggan</th><th>Unit</th><th>Total</th><th>Dibayar</th><th>Piutang</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="payment-list"><tr><td colspan="8" class="empty">Memuat data...</td></tr></tbody></table></div></section></main></div><div id="toast" class="toast"></div><dialog id="payment-modal"><form id="payment-form"><div class="modal-head"><div><p class="eyebrow">Kasir</p><h3>Catat pembayaran</h3><small id="payment-rental-code" class="muted"></small></div><button type="button" class="close-btn" data-close="payment-modal">×</button></div><input id="payment-rental-id" name="penyewaan_id" type="hidden"><label>Jumlah pembayaran<input name="jumlah_bayar" type="number" min="1" step="1000" required></label><label>Metode pembayaran<select name="metode_pembayaran"><option>Tunai</option><option>QRIS</option><option>Transfer</option><option>Debit</option></select></label><label>Catatan<textarea name="catatan" rows="2"></texta
